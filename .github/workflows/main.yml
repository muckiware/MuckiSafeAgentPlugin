name: Testing

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  MODULE_NAME: MuckiSafeAgentPlugin
  MODULE_DIR: custom/plugins/MuckiSafeAgentPlugin
  COMPOSER_NAME: muckiware/mucki-safe-agent-plugin
  # Required dependency, kept identical to tests/Integration/run-shopware.sh
  FACILITY_MODULE_NAME: MuckiFacilityPlugin
  FACILITY_REPOSITORY: muckiware/MuckiFacilityPlugin
  FACILITY_COMPOSER_NAME: muckiware/facility-plugin
  FACILITY_REF: v0.11.0
  FACILITY_CONSTRAINT: ^0.11
  TEST_DATABASE_URL: "mysql://root:root@127.0.0.1:3306/db_test"

jobs:
  ci-current:
    name: SW ${{ matrix.shopware-versions }}, PHP ${{ matrix.php-versions }}, MySQL ${{ matrix.mysql-versions }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        php-versions: [ '8.4', '8.5' ]
        mysql-versions: [ '8.0', '8.4' ]
        shopware-versions: [ 'v6.6.10.25', 'v6.7.14.1' ]
    services:
      mysql:
        image: mysql:${{ matrix.mysql-versions }}
        env:
          MYSQL_DATABASE: db_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, curl, dom, fileinfo, gd, iconv, intl, json, xml, pdo, phar, zip, sodium, pdo_mysql, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: "Check PHP Version"
        run: php -v

      - name: "Check Composer Version"
        run: composer -V

      - name: "Check PHP Extensions"
        run: php -m

      - name: "checkout Shopware"
        uses: actions/checkout@v7
        with:
          repository: shopware/production
          ref: ${{ matrix.shopware-versions }}

      - name: "Checkout ${{ env.COMPOSER_NAME }}"
        uses: actions/checkout@v7
        with:
          path: ${{ env.MODULE_DIR }}

      - name: "Checkout ${{ env.FACILITY_COMPOSER_NAME }}@${{ env.FACILITY_REF }}"
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FACILITY_REPOSITORY }}
          ref: ${{ env.FACILITY_REF }}
          path: custom/plugins/${{ env.FACILITY_MODULE_NAME }}

      - name: "Get composer cache directory"
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: "Cache Composer dependencies"
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php-versions }}-${{ matrix.shopware-versions }}-${{ hashFiles('composer.json', 'custom/plugins/*/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.php-versions }}-${{ matrix.shopware-versions }}-

      - name: "Install Shopware dependencies"
        # Install Shopware with --no-dev to prevent that dev-tools of the module got in conflict with the tools of shopware
        run: |
          composer req shopware/administration:${{ matrix.shopware-versions }} shopware/core:${{ matrix.shopware-versions }} shopware/elasticsearch:${{ matrix.shopware-versions }} shopware/storefront:${{ matrix.shopware-versions }} --no-update
          composer install --no-dev

      - name: "Install plugins"
        # Both plugins resolve through the custom/plugins/* path repository of shopware/production
        run: |
          composer require "${{ env.FACILITY_COMPOSER_NAME }}:${{ env.FACILITY_CONSTRAINT }}" "${{ env.COMPOSER_NAME }}:*" \
            --no-interaction --no-scripts --no-progress

      - name: "Install code-Tools"
        run: |
          composer require --dev phpunit/phpunit:^11.5 phpstan/phpstan symfony/browser-kit \
            --no-interaction --no-scripts --no-progress

      - name: "Verify composer graph"
        run: composer why ${{ env.FACILITY_COMPOSER_NAME }} | grep -q '${{ env.COMPOSER_NAME }}'

      - name: "Install Shopware"
        run: |
          echo APP_ENV=dev >> .env
          echo APP_URL=http://localhost >> .env
          echo DATABASE_URL=${{ env.TEST_DATABASE_URL }} >> .env
          echo APP_SECRET=secretf0rt3st >> .env
          bin/console system:install --basic-setup

      - name: "Install and activate plugins"
        run: |
          bin/console plugin:refresh
          bin/console plugin:install --activate ${{ env.FACILITY_MODULE_NAME }}
          bin/console plugin:install --activate ${{ env.MODULE_NAME }}

      - name: "Run PHPUnit Tests"
        run: ./vendor/bin/phpunit --configuration="${{ env.MODULE_DIR }}/phpunit.xml.dist" --no-progress
