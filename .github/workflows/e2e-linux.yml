# Linux E2E of the packaged agent under the hardened systemd unit
# (agent/packaging/tests/hardening-e2e.sh): install.sh, sandbox, every V1
# host function, refused starts, reload, graceful stop and uninstall.
#
# Architectures, all native (QEMU never replaces a native run):
#   - amd64 and arm64 on GitHub-hosted runners;
#   - arm64 on the self-hosted runner [self-hosted, linux, arm64, muckisafe-e2e]
#     once the repository variable MUCKISAFE_E2E_ARM64_RUNNER is "true"; the
#     service scenarios of Task 32 run there as well.
#
# agent-release.yml calls it with the release tarball, so exactly the
# published binaries are tested; otherwise the agent is built from source.
#
# Service E2E of Task 32 (tests/E2E/scripts/run-linux-e2e.sh): the real
# MuckiSafe compose stack with Facility, this plugin and the packaged agent
# against Bitwarden, Jellyfin, Immich and Paperless — amd64 on GitHub-hosted
# runners, arm64 on the native self-hosted runner. Bitwarden is amd64 only
# (its MSSQL image has no arm64 build) and reports a skip on arm64. Pull
# requests run the harness selftest only; the services run on dev/main,
# manually and from the agent release. Gate E needs a run with a released
# agent tarball and a released MuckiSafe image (input muckisafe-image).

name: Linux E2E

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'agent/**'
      - 'tests/E2E/**'
      - '.github/workflows/e2e-linux.yml'
  workflow_dispatch:
    inputs:
      muckisafe-image:
        description: 'Released MuckiSafe image (ghcr.io/muckiware/muckisafe:vX.Y.Z@sha256:...); empty = source mode'
        required: false
        type: string
        default: ''
      agent-version:
        description: 'Released agent (X.Y.Z of agent-vX.Y.Z) for the service E2E; empty = built from source'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      agent-artifact:
        description: 'Name of the uploaded artifact with the agent release tarball'
        required: false
        type: string
        default: ''
      ref:
        description: 'Ref whose tests and fake control plane are used (default: the triggering commit)'
        required: false
        type: string
        default: ''
      muckisafe-image:
        description: 'Released MuckiSafe image (tag@sha256) for the service E2E; empty = source mode'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  hosted:
    name: Hardening E2E (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps: &e2e-steps
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: "Install Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: "Download the release tarball"
        if: inputs.agent-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.agent-artifact }}
          path: release

      - name: "Prepare agent and fake control plane"
        env:
          AGENT_ARTIFACT: ${{ inputs.agent-artifact }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in x86_64) ARCH=amd64 ;; aarch64) ARCH=arm64 ;; *) echo "unsupported $(uname -m)"; exit 1 ;; esac
          mkdir -p e2e
          if [ -n "${AGENT_ARTIFACT}" ]; then
            (cd release && sha256sum --check --strict ./*.tar.gz.sha256)
            tar -xzf release/*.tar.gz -C e2e --strip-components=1
            (cd e2e && sha256sum --check --strict SHA256SUMS)
            # The listed name, so install.sh verifies it against SHA256SUMS.
            AGENT_BINARY="e2e/mucki-agent-linux-${ARCH}"
          else
            AGENT_BINARY=e2e/mucki-agent
            (cd agent && CGO_ENABLED=0 go build -trimpath -o ../e2e/mucki-agent ./cmd/mucki-agent)
          fi
          mkdir -p tools
          (cd agent && CGO_ENABLED=0 go build -trimpath -o ../tools/fakeplane ./internal/e2e/fakeplane)
          "${AGENT_BINARY}" --version
          echo "AGENT_BINARY=${AGENT_BINARY}" >> "${GITHUB_ENV}"

      - name: "Hardening E2E"
        run: sudo agent/packaging/tests/hardening-e2e.sh --binary "${AGENT_BINARY}" --fakeplane tools/fakeplane

      - name: "Collect logs"
        if: failure()
        run: |
          mkdir -p e2e-logs
          sudo journalctl -u mucki-agent.service --no-pager | tee e2e-logs/mucki-agent.journal > /dev/null || true
          sudo cp /tmp/muwa-e2e-*.log e2e-logs/ 2>/dev/null || true
          sudo chown -R "$(id -u)" e2e-logs

      - name: "Upload logs"
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.runner }}
          path: e2e-logs

  self-hosted-arm64:
    name: Hardening E2E (self-hosted arm64)
    if: vars.MUCKISAFE_E2E_ARM64_RUNNER == 'true'
    strategy:
      matrix:
        # one entry, so the shared steps name their log artifact alike
        runner: [ self-hosted-arm64 ]
    runs-on: [ self-hosted, linux, arm64, muckisafe-e2e ]
    timeout-minutes: 30
    steps: *e2e-steps

  harness-selftest:
    name: Service E2E harness selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: "Selftest"
        run: tests/E2E/scripts/selftest.sh

  services:
    name: Service E2E ${{ matrix.scenario }} (${{ matrix.arch }})
    needs: [ hosted, harness-selftest ]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        scenario: [ bitwarden, jellyfin, immich, paperless ]
        arch: [ amd64 ]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps: &service-steps
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: "Install Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: "Download the release tarball"
        if: inputs.agent-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.agent-artifact }}
          path: release

      - name: "Download the agent release"
        if: inputs.agent-artifact == '' && inputs.agent-version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_VERSION: ${{ inputs.agent-version }}
        run: |
          set -euo pipefail
          [[ "${AGENT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid agent version"; exit 1; }
          gh release download "agent-v${AGENT_VERSION}" --repo "${GITHUB_REPOSITORY}" --dir release \
            --pattern "mucki-agent-${AGENT_VERSION}-linux.tar.gz*"

      - name: "MuckiSafe compose file under test"
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^MUCKISAFE_COMPOSE_REF=//p' tests/E2E/versions.env)
          git clone --quiet https://github.com/muckiware/MuckiSafe.git e2e-muckisafe
          git -C e2e-muckisafe checkout --quiet "${ref}"

      - name: "Service E2E"
        env:
          SCENARIO: ${{ matrix.scenario }}
          ARCH: ${{ matrix.arch }}
          MUCKISAFE_IMAGE: ${{ inputs.muckisafe-image }}
        run: |
          set -euo pipefail
          args=(--arch "${ARCH}" --scenario "${SCENARIO}" --out "${PWD}/e2e-out")
          envs=("PATH=${PATH}" "MUWA_E2E_MUCKISAFE_DIR=${PWD}/e2e-muckisafe")
          if compgen -G 'release/*.tar.gz' >/dev/null; then
            tarball=$(ls release/*.tar.gz)
            args+=(--agent-mode release)
            envs+=("MUWA_E2E_AGENT_TARBALL=${PWD}/${tarball}")
          fi
          if [ -n "${MUCKISAFE_IMAGE}" ]; then
            args+=(--muckisafe-mode release)
            envs+=("MUWA_E2E_MUCKISAFE_IMAGE=${MUCKISAFE_IMAGE}")
          fi
          sudo env "${envs[@]}" tests/E2E/scripts/run-linux-e2e.sh "${args[@]}"

      # The run is root; a persistent self-hosted runner must be able to
      # clean its workspace in the next checkout.
      - name: "Hand the artifacts back to the runner user"
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" e2e-out e2e-muckisafe 2>/dev/null || true

      - name: "Upload artifacts"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: service-e2e-${{ matrix.scenario }}-${{ matrix.arch }}
          path: e2e-out
          if-no-files-found: warn

  services-arm64:
    name: Service E2E ${{ matrix.scenario }} (${{ matrix.arch }}, self-hosted)
    needs: [ self-hosted-arm64, harness-selftest ]
    if: github.event_name != 'pull_request' && vars.MUCKISAFE_E2E_ARM64_RUNNER == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Bitwarden reports the documented amd64-only skip.
        scenario: [ bitwarden, jellyfin, immich, paperless ]
        arch: [ arm64 ]
    runs-on: [ self-hosted, linux, arm64, muckisafe-e2e ]
    timeout-minutes: 150
    steps: *service-steps
