# Pinned Immich reference stack of the Linux service E2E (Task 32), modelled
# on Immich's documented docker-compose.yml (server, machine learning, Valkey,
# PostgreSQL with VectorChord). Started by tests/E2E/scenarios/immich.sh as
# its own Compose project (muwa-e2e-immich); every image comes from
# tests/E2E/images.lock, every host path from the scenario:
#
#   UPLOAD_LOCATION, THUMB_LOCATION,   the policy roots of the fixture layout
#   ENCODED_VIDEO_LOCATION,            (default: the three derivative
#   PROFILE_LOCATION                   locations lie inside UPLOAD_LOCATION)
#   DB_PASSWORD                        generated per run, never a real secret
#   IMMICH_CONFIG_LOCATION             copy of fixtures/immich/immich-config.json
#
# The container name immich_postgres is the policy's container alias
# immich-postgres. DB_DATA_LOCATION is a named volume of this project and
# never a backup source. The version endpoint is published on 127.0.0.1:2283
# only (policy endpoint immich-version of the contract).

services:
  immich-server:
    container_name: immich_server
    image: ${IMMICH_SERVER_IMAGE:?pin from tests/E2E/images.lock}
    volumes:
      - ${UPLOAD_LOCATION:?}:/data
      - ${THUMB_LOCATION:?}:/data/thumbs
      - ${ENCODED_VIDEO_LOCATION:?}:/data/encoded-video
      - ${PROFILE_LOCATION:?}:/data/profile
      - ${IMMICH_CONFIG_LOCATION:?}:/config/immich.json:ro
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_CONFIG_FILE: /config/immich.json
    ports:
      - "127.0.0.1:2283:2283"
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ${IMMICH_MACHINE_LEARNING_IMAGE:?pin from tests/E2E/images.lock}
    volumes:
      - model-cache:/cache
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: ${IMMICH_VALKEY_IMAGE:?pin from tests/E2E/images.lock}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: always

  database:
    container_name: immich_postgres
    image: ${IMMICH_POSTGRES_IMAGE:?pin from tests/E2E/images.lock}
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --dbname=immich --username=postgres || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: always

volumes:
  model-cache:
  pgdata:
